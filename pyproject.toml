[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cachebind"
version = "1.0.1"
description = "Python library for building clean caching pipelines with support for common caching patterns."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "goroba" }]
dependencies = []

[project.optional-dependencies]
redis = ["redis>=5"]
pydantic = ["pydantic>=2"]
dev = ["pytest>=8", "fakeredis>=2", "pydantic>=2"]

[tool.pytest.ini_options]
testpaths = ["tests"]
